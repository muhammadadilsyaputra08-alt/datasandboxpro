name: CI

on:
  push:
    branches: [ main, feature/formula-engine ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Grant execute
        run: chmod +x gradlew || true
      - name: Run tests
        run: ./gradlew test --no-daemon
